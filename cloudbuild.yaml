# Build and deploy of the backend (docs/BETRIEB.md). Before the first deploy
# with this file: create the service account and secrets as described there.
#
# Substitutions (set them in the Cloud Build trigger):
#   _PUBLIC_APP_URL  https address of this service, used in upload links (required)
#   _CORS_ORIGINS    allowed origins, separated by "," (e.g. https://www.example.de)
#   _SECRETS         complete list of secrets; --set-secrets replaces all
#                    existing ones, so everything the service needs is listed
#   _SMTP_HOST, _SMTP_FROM, _CONTACT_NOTIFY_TO  e-mail notification (optional)
#   _FIREBASE_PROJECT_ID, _FIREBASE_API_KEY, _FIREBASE_AUTH_DOMAIN, _FIREBASE_APP_ID
#                    web configuration of the Firebase project (sign-in, required)
#   _FIREBASE_PROVIDERS  sign-in options: password, google, microsoft (separated by ",")
#   _ADMIN_EMAILS    always admin, to grant the first accesses (separated by ",")
substitutions:
  _PUBLIC_APP_URL: ''
  _CORS_ORIGINS: ''
  _SECRETS: 'JWT_SECRET=JWT_SECRET:latest,GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest'
  _SMTP_HOST: ''
  _SMTP_FROM: ''
  _CONTACT_NOTIFY_TO: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_PROVIDERS: 'password,google'
  _ADMIN_EMAILS: ''

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$BUILD_ID
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$BUILD_ID

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - motavi-backend
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$BUILD_ID
      - --region=europe-west3
      - --platform=managed
      # own service account without key (docs/BETRIEB.md, roles listed there)
      - --service-account=motavi-backend@$PROJECT_ID.iam.gserviceaccount.com
      # the website form and the upload page are public; every job route
      # checks the sign-in itself (routers/auth.py)
      - --allow-unauthenticated
      # MediaPipe-Heavy + OpenCV brauchen Ressourcen, sonst OOM
      - --memory=4Gi
      - --cpu=2
      # CPU bleibt nach dem 202-Response aktiv → BackgroundTask läuft durch
      - --no-cpu-throttling
      - --timeout=900
      # requests per instance; analyses run as background tasks on top
      # (a worker with Cloud Run Jobs is planned, docs/WORKER.md)
      - --concurrency=4
      # cost ceiling
      - --max-instances=3
      - --set-secrets=${_SECRETS}
      - --update-env-vars=^;^APP_ENV=production;PUBLIC_APP_URL=${_PUBLIC_APP_URL};CORS_ORIGINS=${_CORS_ORIGINS};SMTP_HOST=${_SMTP_HOST};SMTP_FROM=${_SMTP_FROM};CONTACT_NOTIFY_TO=${_CONTACT_NOTIFY_TO};FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID};FIREBASE_API_KEY=${_FIREBASE_API_KEY};FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN};FIREBASE_APP_ID=${_FIREBASE_APP_ID};FIREBASE_PROVIDERS=${_FIREBASE_PROVIDERS};ADMIN_EMAILS=${_ADMIN_EMAILS}

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$BUILD_ID

# Standard-Build-Maschine reicht nicht für das große Docker-Image (MediaPipe).
options:
  machineType: 'E2_HIGHCPU_8'
