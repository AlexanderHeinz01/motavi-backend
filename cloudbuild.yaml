steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$COMMIT_SHA
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$COMMIT_SHA

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - motavi-backend
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$COMMIT_SHA
      - --region=europe-west3
      - --platform=managed
      - --allow-unauthenticated
      # MediaPipe-Heavy + OpenCV brauchen Ressourcen, sonst OOM
      - --memory=4Gi
      - --cpu=2
      # CPU bleibt nach dem 202-Response aktiv → BackgroundTask läuft durch
      - --no-cpu-throttling
      # bis zu 15 min pro Request (großer Upload + Modell-Download)
      - --timeout=900
      # max. 4 parallele Jobs pro Instanz, damit RAM nicht überläuft
      - --concurrency=4
      - --set-secrets=GCP_SERVICE_ACCOUNT_KEY=GCP_SERVICE_ACCOUNT_KEY:latest,GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/motavi/backend:$COMMIT_SHA

# Standard-Build-Maschine reicht nicht für das große Docker-Image (MediaPipe).
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
